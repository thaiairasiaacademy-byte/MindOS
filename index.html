<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>แบบฝึกหัดคำศัพท์</title>
  
  <!-- Preconnect เพื่อให้โหลด Font ได้เร็วขึ้น -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
  
  <!-- ✅ เพิ่ม SweetAlert2 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    body { font-family: 'Kanit', sans-serif; background-color: #f0f2f5; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 90vh; margin: 0; }
    
    /* กล่องหลัก */
    .card { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 450px; text-align: center; }
    
    /* รูปภาพโจทย์ */
    img.question-img { 
      width: 100%; height: auto; border-radius: 10px; margin-bottom: 20px; 
      border: 1px solid #ddd; box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      max-height: 250px; object-fit: contain; background: #eee;
    }
    
    /* Inputs */
    input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; font-family: 'Kanit'; box-sizing: border-box;}
    input:focus { outline: none; border-color: #4285F4; background: #fafdff; }
    
    /* Buttons */
    button { background-color: #4285F4; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-size: 18px; cursor: pointer; width: 100%; margin-top: 15px; transition: 0.3s; }
    button:hover { background-color: #357ae8; }
    button:disabled { background-color: #999; cursor: not-allowed; }
    
    .hidden { display: none !important; }
    .progress { color: #666; margin-bottom: 15px; font-weight: 600; }
    .fade-in { animation: fadeIn 0.5s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    /* --- ส่วน Style ของหน้าสรุป (Summary) --- */
    h2.summary-head { color: #27ae60; margin-top: 0; }
    .summary-list { text-align: left; margin-top: 20px; max-height: 60vh; overflow-y: auto; padding-right: 5px; }
    
    .summary-item { background: #f8f9fa; border: 1px solid #e9ecef; border-radius: 10px; padding: 10px; margin-bottom: 15px; display: flex; gap: 10px; align-items: center; }
    .thumb-img { width: 60px; height: 60px; object-fit: cover; border-radius: 8px; border: 1px solid #ddd; }
    .answers-box { flex: 1; }
    
    .ans-tag { display: inline-block; font-size: 0.85rem; padding: 2px 8px; border-radius: 12px; margin: 2px; color: white; }
    .c1 { background: #e74c3c; }
    .c2 { background: #3498db; }
    .c3 { background: #2ecc71; }

    /* ✅ Style สำหรับหน้า Loading */
    #loadingScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #f0f2f5; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; }
    .spinner { border: 5px solid #ddd; border-top: 5px solid #4285F4; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin-bottom: 15px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <!-- ✅ หน้าจอ Loading -->
  <div id="loadingScreen">
    <div class="spinner"></div>
    <h3 style="color: #555; margin: 0;">กำลังเตรียมรูปภาพ...</h3>
    <p style="color: #888; font-size: 0.9rem;" id="loadingText">รอสักครู่</p>
  </div>

  <!-- ตอนเริ่มต้นให้ซ่อน formCard ไว้ก่อน -->
  <div class="card hidden" id="formCard">
    <div class="progress" id="progressText">ข้อที่ 1 / 5</div>
    
    <img id="questionImg" src="" alt="Loading..." class="question-img fade-in">
    
    <p style="margin: 0 0 10px 0; color: #444;">พิมพ์ 3 คำสั้นๆ ที่นึกถึง</p>
    <input type="text" id="w1" placeholder="คำที่ 1" required autocomplete="off">
    <input type="text" id="w2" placeholder="คำที่ 2" required autocomplete="off">
    <input type="text" id="w3" placeholder="คำที่ 3" required autocomplete="off">
    
    <button onclick="submitData()" id="btnSubmit">ส่งคำตอบ</button>
  </div>

  <div class="card hidden" id="summaryCard">
    <h2 class="summary-head">🎉 ส่งครบแล้ว!</h2>
    <p style="color:#666; font-size:0.9rem;">นี่คือสรุปคำตอบของคุณ</p>
    
    <div class="summary-list" id="summaryContainer"></div>

    <button onclick="location.reload()" style="background-color: #95a5a6; margin-top: 20px;">เริ่มใหม่</button>
  </div>

  <script>
    // 🔴🔴🔴 ตรวจสอบ URL ของ Google Apps Script 🔴🔴🔴
    const GAS_URL = "https://script.google.com/macros/s/AKfycbyCVvKtFClPk6qkSUGmxUNRG7JbiIBhN2gDxRK_PfZnE7RgL34PaDPxWWLbsLFMJmeQqQ/exec"; 

    var imageList = [
      "https://i.postimg.cc/76PdMBXR/Slide2-0.png",
      "https://i.postimg.cc/631jVB86/Slide3-0.png",
      "https://i.postimg.cc/h4NgcB24/Slide4-0.png",
      "https://i.postimg.cc/1zR1J53n/Slide5-0.png",
      "https://i.postimg.cc/mDJxLYNS/Slide6-0.png"
    ];

    var currentIndex = 0;
    var userHistory = []; 

    // ✅ ฟังก์ชันโหลดรูปภาพแบบบังคับรอ (Promise.all)
    window.onload = function() {
      let loadedCount = 0;
      const loadingText = document.getElementById('loadingText');

      // สร้าง Array ของ Promise เพื่อให้โหลดภาพทั้งหมดพร้อมกัน
      const imagePromises = imageList.map((src) => {
        return new Promise((resolve, reject) => {
          const img = new Image();
          img.src = src;
          img.onload = () => {
            loadedCount++;
            loadingText.innerText = `โหลดสำเร็จ ${loadedCount} / ${imageList.length}`;
            resolve();
          };
          img.onerror = () => resolve(); // หากภาพบางรูปเสีย ก็ให้ข้ามไปเพื่อไม่ให้ค้าง
        });
      });

      // เมื่อภาพทั้งหมดถูกโหลดเสร็จแล้ว
      Promise.all(imagePromises).then(() => {
        document.getElementById('loadingScreen').style.display = 'none';
        document.getElementById('formCard').classList.remove('hidden');
        loadState();
      });
    };

    function loadState() {
      if (currentIndex < imageList.length) {
        var img = document.getElementById('questionImg');
        img.src = imageList[currentIndex];
        
        document.getElementById('progressText').innerText = "ภาพที่ " + (currentIndex + 1) + " จาก " + imageList.length;
        
        document.getElementById('w1').value = "";
        document.getElementById('w2').value = "";
        document.getElementById('w3').value = "";
        
        var btn = document.getElementById('btnSubmit');
        btn.disabled = false;
        btn.innerText = "ส่งคำตอบ";
        
        setTimeout(() => document.getElementById('w1').focus(), 100);

        img.classList.remove('fade-in');
        void img.offsetWidth;
        img.classList.add('fade-in');

      } else {
        showSummary();
      }
    }

    function submitData() {
      var w1 = document.getElementById('w1').value.trim();
      var w2 = document.getElementById('w2').value.trim();
      var w3 = document.getElementById('w3').value.trim();

      // ✅ ใช้ SweetAlert2 แทน alert() ธรรมดา
      if(!w1 || !w2 || !w3) {
        Swal.fire({
          icon: 'warning',
          title: 'ข้อมูลไม่ครบถ้วน',
          text: 'กรุณาเติมคำให้ครบทั้ง 3 ช่องครับ',
          confirmButtonColor: '#4285F4',
          confirmButtonText: 'ตกลง'
        });
        return;
      }

      var btn = document.getElementById('btnSubmit');
      btn.innerText = "กำลังบันทึก...";
      btn.disabled = true;

      userHistory.push({ imgIndex: currentIndex, w1: w1, w2: w2, w3: w3 });

      var data = { 
        imgId: currentIndex + 1, 
        w1: w1, w2: w2, w3: w3 
      };

      fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(data)
      })
      .then(response => response.json())
      .then(result => {
        if(result.status === 'success') {
          currentIndex++;
          loadState();
        } else {
          // ✅ SweetAlert2 กรณี Error จากฝั่ง Google Script
          Swal.fire({
            icon: 'error',
            title: 'เกิดข้อผิดพลาด',
            text: 'เกิดข้อผิดพลาดจากเซิร์ฟเวอร์ กรุณาลองใหม่',
            confirmButtonColor: '#e74c3c'
          });
          btn.innerText = "ส่งคำตอบ";
          btn.disabled = false;
        }
      })
      .catch(error => {
        console.error("Error:", error);
        // ✅ SweetAlert2 กรณีเน็ตหลุด / หรือเรียก URL ไม่ได้
        Swal.fire({
          icon: 'error',
          title: 'การเชื่อมต่อมีปัญหา',
          text: 'ไม่สามารถติดต่อเซิร์ฟเวอร์ได้ กรุณาตรวจสอบอินเทอร์เน็ตแล้วลองใหม่',
          confirmButtonColor: '#e74c3c'
        });
        btn.innerText = "ส่งคำตอบ";
        btn.disabled = false;
      });
    }

    function showSummary() {
      document.getElementById('formCard').classList.add('hidden');
      document.getElementById('summaryCard').classList.remove('hidden');
      var container = document.getElementById('summaryContainer');
      var html = "";

      userHistory.forEach((item, index) => {
        var imgUrl = imageList[item.imgIndex];
        html += `
          <div class="summary-item">
            <img src="${imgUrl}" class="thumb-img">
            <div class="answers-box">
              <div style="font-size:0.8rem; color:#888; margin-bottom:4px;">ภาพที่ ${index + 1}</div>
              <div>
                <span class="ans-tag c1">${item.w1}</span>
                <span class="ans-tag c2">${item.w2}</span>
                <span class="ans-tag c3">${item.w3}</span>
              </div>
            </div>
          </div>
        `;
      });
      
      // แสดงข้อความยินดีเมื่อทำเสร็จ
      Swal.fire({
        icon: 'success',
        title: 'ยอดเยี่ยม!',
        text: 'คุณทำแบบฝึกหัดครบทุกข้อแล้ว',
        confirmButtonColor: '#2ecc71',
        timer: 2000,
        showConfirmButton: false
      });

      container.innerHTML = html;
    }
  </script>
</body>
</html>
